spring:
  profiles:
    default: local
  application:
    name: wow-talk
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

wowtalk:
  cors:
    allowed-origins: ${WOWTALK_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  observability:
    slow-service-threshold-ms: ${WOWTALK_SLOW_SERVICE_THRESHOLD_MS:500}
