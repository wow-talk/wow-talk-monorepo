spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

wowtalk:
  realtime:
    broker: ${WOWTALK_REALTIME_BROKER:local}
    redis:
      channel-prefix: ${WOWTALK_REALTIME_REDIS_CHANNEL_PREFIX:wowtalk:room-events}
  dynamodb:
    enabled: true
    initialize-schema: false
    endpoint: ${WOWTALK_DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:ap-northeast-2}
    main-table: ${WOWTALK_DYNAMODB_MAIN_TABLE:wowtalk-main}
    room-events-table: ${WOWTALK_DYNAMODB_ROOM_EVENTS_TABLE:wowtalk-room-events}
